name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Public config for the e2e's mocked account service (e2e/supabase.ts), so the build's CSP
          # and the guest-isolation checks see a configured service (F-SEC-08/09). Not a real project.
          VITE_SUPABASE_URL: https://e2e-project.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_e2e
      - name: Initial JS budget (350 KB gzip)
        run: npm run size
      - run: npx playwright install --with-deps chromium
      - name: E2E (demo mode, production build)
        run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
